<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProEditsAPK - Professional CMS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .container {
            width: 100%; max-width: 1050px; background: var(--glass-bg);
            backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .login-box { text-align: center; max-width: 450px; margin: 0 auto; }
        .login-box h1 { font-size: 28px; margin-bottom: 8px; color: #818cf8; }
        .login-box p { color: var(--text-muted); margin-bottom: 30px; font-size: 14px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); }

        input, textarea {
            width: 100%; padding: 14px 18px; background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); font-size: 15px; outline: none;
        }
        textarea { resize: vertical; min-height: 200px; line-height: 1.6; }

        button {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
        }

        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .btn-logout { width: auto; padding: 8px 16px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }

        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); color: var(--text-muted); border-radius: 10px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .post-card { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--glass-border); border-radius: 14px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; border-radius: 8px; cursor: pointer; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
        .badge-published { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-left: 8px; }
        .msg { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN VIEW -->
        <div id="loginView" class="login-box">
            <h1>ProEditsAPK CMS</h1>
            <p>Security Verification Login</p>
            <div class="input-group">
                <label>Question: Haseeb Life kon he?</label>
                <input type="text" id="secAnswer" placeholder="Enter security answer">
            </div>
            <div class="input-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="token" placeholder="Paste GitHub token">
            </div>
            <button type="button" onclick="handleLogin()">Login to Dashboard</button>
            <div id="loginMsg" class="msg" style="color: var(--danger);"></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboardView" style="display: none;">
            <div class="dashboard-header">
                <h2>ProEditsAPK Control Center</h2>
                <button class="btn-logout" onclick="handleLogout()">Logout</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="tabCreateBtn" onclick="switchTab('create')">New / Edit Article</button>
                <button class="tab-btn" id="tabManageBtn" onclick="switchTab('manage')">Manage Articles</button>
            </div>

            <!-- CREATE / EDIT TAB -->
            <div id="createTab" class="tab-content active">
                <input type="hidden" id="editSha" value="">
                <input type="hidden" id="editFilename" value="">
                
                <div class="input-group">
                    <label>Article Title</label>
                    <input type="text" id="postTitle" placeholder="e.g. Kinemaster Pro Mod APK">
                </div>
                <div class="input-group">
                    <label>Meta Description</label>
                    <input type="text" id="metaDesc" placeholder="Short SEO description">
                </div>
                <div class="input-group">
                    <label>Article Content (Markdown / HTML)</label>
                    <textarea id="postContent" placeholder="Write your review or guide here..."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="button" onclick="publishPost(false)" style="background: var(--success);">⚡ Publish / Update Live</button>
                </div>
                <div id="actionMsg" class="msg"></div>
            </div>

            <!-- MANAGE TAB -->
            <div id="manageTab" class="tab-content">
                <h3 style="margin-bottom: 15px; font-size: 16px; color: var(--text-muted);">Published Articles List</h3>
                <div id="postsList">Loading articles...</div>
            </div>
        </div>
    </div>

    <script>
        const REPO = "haseebaslam091-afk/proeditsapk";
        const SECURITY_ANSWER = "Laadi Wifoxo";
        let authData = JSON.parse(localStorage.getItem('proedits_auth') || 'null');

        document.addEventListener("DOMContentLoaded", () => {
            if (authData) showDashboard();
        });

        function handleLogin() {
            const ans = document.getElementById('secAnswer').value.trim();
            const t = document.getElementById('token').value.trim();
            if (ans.toLowerCase() === SECURITY_ANSWER.toLowerCase() && t.length > 5) {
                authData = { token: t };
                localStorage.setItem('proedits_auth', JSON.stringify(authData));
                showDashboard();
            } else {
                document.getElementById('loginMsg').innerText = "Ghalat jawab ya token!";
            }
        }

        function handleLogout() {
            localStorage.removeItem('proedits_auth');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadPosts();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'create') {
                document.getElementById('tabCreateBtn').classList.add('active');
                document.getElementById('createTab').classList.add('active');
            } else {
                document.getElementById('tabManageBtn').classList.add('active');
                document.getElementById('manageTab').classList.add('active');
                loadPosts();
            }
        }

        async function loadPosts() {
            const listDiv = document.getElementById('postsList');
            listDiv.innerHTML = "Fetching articles...";
            try {
                let res = await fetch(`https://api.github.com/repos/${REPO}/contents/_posts`, {
                    headers: { 'Authorization': `token ${authData.token}` }
                });
                if(!res.ok) throw new Error("Could not fetch _posts folder");
                const files = await res.json();
                
                let html = '';
                for(let file of files) {
                    if(file.name.endsWith('.md') || file.name.endsWith('.html')) {
                        html += `
                            <div class="post-card">
                                <div>
                                    <h4>${file.name} <span class="badge-published">Live</span></h4>
                                    <span style="font-size:12px; color:var(--text-muted);">${file.path}</span>
                                </div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn-sm" onclick="editPost('${file.path}')">Edit</button>
                                    <button class="btn-sm btn-danger" onclick="deletePost('${file.path}')">Delete</button>
                                </div>
                            </div>
                        `;
                    }
                }
                listDiv.innerHTML = html || "<p style='color:var(--text-muted);'>No articles found.</p>";
            } catch(e) {
                listDiv.innerHTML = `<p style="color:var(--danger);">Error: ${e.message}</p>`;
            }
        }

        async function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const desc = document.getElementById('metaDesc').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const editFilename = document.getElementById('editFilename').value.trim();
            const editSha = document.getElementById('editSha').value.trim();
            const msgEl = document.getElementById('actionMsg');

            if(!title || !content) {
                alert("Please fill in title and content!");
                return;
            }

            let cleanSlug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            let todayDateStr = new Date().toISOString().split('T')[0];
            let finalFilePath = editFilename || `_posts/${todayDateStr}-${cleanSlug}.md`;

            const fileContent = `---
layout: post
title: "${title.replace(/"/g, '\\"')}"
description: "${desc.replace(/"/g, '\\"')}"
date: ${new Date().toISOString()}
---

${content}`;

            let encodedContent = btoa(unescape(encodeURIComponent(fileContent)));
            msgEl.innerText = "Saving to GitHub...";

            try {
                let sha = editSha;
                if(!sha) {
                    try {
                        const checkRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${finalFilePath}`, {
                            headers: { 'Authorization': `token ${authData.token}` }
                        });
                        if(checkRes.ok) {
                            const checkData = await checkRes.json();
                            sha = checkData.sha;
                        }
                    } catch(e) {}
                }

                let bodyData = {
                    message: `CMS: Update/Create ${title}`,
                    content: encodedContent
                };
                if(sha) bodyData.sha = sha;

                let res = await fetch(`https://api.github.com/repos/${REPO}/contents/${finalFilePath}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${authData.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if(res.ok) {
                    alert("Article successfully saved!");
                    document.getElementById('postTitle').value = '';
                    document.getElementById('metaDesc').value = '';
                    document.getElementById('postContent').value = '';
                    document.getElementById('editFilename').value = '';
                    document.getElementById('editSha').value = '';
                    switchTab('manage');
                } else {
                    const err = await res.json();
                    throw new Error(err.message || "Failed to save");
                }
            } catch(e) {
                alert("Error: " + e.message);
                msgEl.innerText = "";
            }
        }

        async function editPost(filePath) {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${filePath}`, {
                    headers: { 'Authorization': `token ${authData.token}` }
                });
                const data = await res.json();
                const decoded = decodeURIComponent(atob(data.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));

                document.getElementById('editFilename').value = data.path;
                document.getElementById('editSha').value = data.sha;

                let titleVal = "";
                let descVal = "";
                let contentVal = decoded;

                if (decoded.includes('---')) {
                    const parts = decoded.split('---');
                    if (parts.length >= 3) {
                        const frontMatter = parts[1];
                        contentVal = parts.slice(2).join('---').trim();
                        const titleMatch = frontMatter.match(/title:\s*"([^"]+)"/);
                        if (titleMatch) titleVal = titleMatch[1];
                        const descMatch = frontMatter.match(/description:\s*"([^"]+)"/);
                        if (descMatch) descVal = descMatch[1];
                    }
                }

                document.getElementById('postTitle').value = titleVal;
                document.getElementById('metaDesc').value = descVal;
                document.getElementById('postContent').value = contentVal;
                switchTab('create');
            } catch(e) {
                alert("Could not load file: " + e.message);
            }
        }

        async function deletePost(filePath) {
            if(!confirm(`Kya aap waqai ${filePath} ko delete karna chahte hain?`)) return;
            try {
                const checkRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${filePath}`, {
                    headers: { 'Authorization': `token ${authData.token}` }
                });
                if(!checkRes.ok) throw new Error("File not found on GitHub");
                const fileData = await checkRes.json();

                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${filePath}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `token ${authData.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Delete ${filePath}`, sha: fileData.sha })
                });

                if(res.ok) {
                    alert("Article successfully deleted!");
                    loadPosts();
                } else {
                    throw new Error("Delete operation failed");
                }
            } catch(e) {
                alert("Error deleting file: " + e.message);
            }
        }
    </script>
</body>
</html>
