<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080d1c"><title>Publisher · ProEditsAPK</title>
<style>
:root{color-scheme:dark;--bg:#080d1c;--panel:#101a30;--line:#263754;--text:#eef4ff;--muted:#9aabc6;--cyan:#50e0dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,92%);margin:35px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:850}.brand span{color:var(--cyan)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:20px}h1{font-size:30px;margin:0}h2{font-size:20px;margin:0 0 12px}p,.muted{color:var(--muted)}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#080f20;color:var(--text);font:inherit}textarea{min-height:260px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:10px;padding:12px 17px;background:linear-gradient(100deg,#3189e8,#27c8cb);color:#06101d;font-weight:800;font-size:14px;cursor:pointer}.btn.alt{background:#172640;color:white;border:1px solid var(--line)}.status{white-space:pre-wrap;margin-top:14px;color:var(--cyan)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item a{color:var(--cyan)}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:20px auto}.panel{padding:17px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">ProEdits<span>APK</span> Publisher</div><a class="btn alt" href="/">View website</a></div>
<section class="panel"><h1>Publish an article</h1><p>Cloudflare Access protects this workspace. Published articles are committed to the GitHub repository and added to the sitemap.</p>
<form id="form"><label for="title">Article title</label><input id="title" maxlength="160" required placeholder="A clear, helpful article title">
<div class="grid"><div><label for="slug">Permanent URL slug</label><input id="slug" required placeholder="example-article"></div><div><label for="packageName">Google Play package ID (optional)</label><input id="packageName" placeholder="com.example.app"><label for="description">Meta description</label><input id="description" maxlength="320" placeholder="Short search description"></div></div>
<label for="content">Article content (Markdown)</label><textarea id="content" required placeholder="# Introduction&#10;&#10;Write helpful, original content here..."></textarea>
<p class="muted">Minimum 80 characters. Do not paste passwords, API keys or private information.</p><button class="btn" id="publish">Publish to website</button></form><div id="status" class="status" role="status"></div></section>
<section class="panel"><div class="top"><h2>Published articles</h2><button class="btn alt" id="refresh">Refresh list</button></div><div id="posts" class="muted">Loading…</div></section></main>
<script>
const $=id=>document.getElementById(id);
function slugify(s){return s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90)}
$('title').addEventListener('input',()=>{if(!$('slug').dataset.edited)$('slug').value=slugify($('title').value)});
$('slug').addEventListener('input',()=>{$('slug').dataset.edited='1';$('slug').value=slugify($('slug').value)});
async function call(path,options={}){const r=await fetch('/admin/api/'+path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const d=await call('posts');$('posts').innerHTML=d.posts.filter(p=>p.published!==false).map(p=>'<div class="item"><b>'+escapeHtml(p.title)+'</b><br><a href="/articles/'+encodeURIComponent(p.slug||slugify(p.title))+'" target="_blank" rel="noopener">Open article ↗</a></div>').join('')||'No published articles.'}catch(e){$('posts').textContent=e.message}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('publish').disabled=true;$('status').textContent='Publishing…';try{const d=await call('publish',{method:'POST',body:JSON.stringify({title:$('title').value,slug:$('slug').value,packageName:$('packageName').value,description:$('description').value,content:$('content').value})});$('status').textContent='Published successfully: '+d.url;$('form').reset();$('slug').dataset.edited='';await load()}catch(err){$('status').textContent='Not published: '+err.message}finally{$('publish').disabled=false}});
$('refresh').addEventListener('click',load);load();
</script></body></html>
