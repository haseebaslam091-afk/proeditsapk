<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProEditsAPK - Professional 3D CMS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            padding: 40px;
            transition: all 0.3s ease;
        }

        hheading, h1, h2, h3 {
            color: var(--text-main);
            font-weight: 700;
        }

        .login-box {
            text-align: center;
        }

        .login-box h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-box p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .dashboard-header h2 {
            font-size: 22px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-logout {
            width: auto;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .post-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .post-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .post-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            width: auto;
            border-radius: 8px;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .msg {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- LOGIN VIEW -->
        <div id="loginView" class="login-box">
            <h1>ProEditsAPK CMS</h1>
            <p>Professional 3D Secure Admin Login</p>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <div class="input-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button onclick="handleLogin()">Login to Dashboard</button>
            <div id="loginMsg" class="msg" style="color: var(--danger);"></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboardView" style="display: none;">
            <div class="dashboard-header">
                <h2>ProEditsAPK Control Center</h2>
                <button class="btn-logout" onclick="handleLogout()">Logout</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('create')">New Article / APK</button>
                <button class="tab-btn" onclick="switchTab('manage')">Manage Articles</button>
            </div>

            <!-- CREATE / EDIT POST TAB -->
            <div id="createTab" class="tab-content active">
                <input type="hidden" id="editSha" value="">
                <input type="hidden" id="editFilename" value="">
                
                <div class="input-group">
                    <label>Post Title & Version (SEO Title)</label>
                    <input type="text" id="postTitle" placeholder="e.g. Kinemaster Pro APK v6.5 Latest">
                </div>
                <div class="input-group">
                    <label>URL Slug</label>
                    <input type="text" id="postSlug" placeholder="e.g. kinemaster-pro-apk">
                </div>
                <div class="input-group">
                    <label>SEO Meta Description</label>
                    <input type="text" id="metaDesc" placeholder="Short description for Google search results">
                </div>
                <div class="input-group">
                    <label>Article Content & Download Link (Markdown / HTML)</label>
                    <textarea id="postContent" rows="10" placeholder="Write detailed review, features, and add download link like [Download APK](#)"></textarea>
                </div>
                <button onclick="publishPost()" id="publishBtn">Publish Article</button>
                <div id="actionMsg" class="msg"></div>
            </div>

            <!-- MANAGE POSTS TAB -->
            <div id="manageTab" class="tab-content">
                <h3 style="margin-bottom: 15px; font-size: 16px; color: var(--text-muted);">Published Articles List</h3>
                <div id="postsList">Loading articles...</div>
            </div>
        </div>
    </div>

    <script>
        const REPO = "haseebasam091/proeditsapk";
        const ADMIN_USER = "AdamSultan10";
        const ADMIN_PASS = "Sultan@786";

        let authData = JSON.parse(localStorage.getItem('proedits_auth') || 'null');

        if (authData) {
            showDashboard();
        }

        function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const t = document.getElementById('token').value.trim();

            if (u === ADMIN_USER && p === ADMIN_PASS && t.startsWith('ghp_')) {
                authData = { token: t };
                localStorage.setItem('proedits_auth', JSON.stringify(authData));
                showDashboard();
            } else {
                document.getElementById('loginMsg').innerText = "Invalid credentials or token!";
            }
        }

        function handleLogout() {
            localStorage.removeItem('proedits_auth');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadPosts();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'create') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('createTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('manageTab').classList.add('active');
                loadPosts();
            }
        }

        async function loadPosts() {
            const listDiv = document.getElementById('postsList');
            listDiv.innerHTML = "Fetching articles...";
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/_posts`, {
                    headers: { 'Authorization': `token ${authData.token}` }
                });
                if(!res.ok) throw new Error("Could not fetch posts");
                const files = await res.json();
                
                if(files.length === 0) {
                    listDiv.innerHTML = "<p style='color: var(--text-muted);'>No articles found.</p>";
                    return;
                }

                let html = '';
                for(let file of files) {
                    if(file.name.endsWith('.md') || file.name.endsWith('.html')) {
                        html += `
                            <div class="post-card">
                                <div class="post-info">
                                    <h4>${file.name}</h4>
                                    <span>Path: ${file.path}</span>
                                </div>
                                <div class="post-actions">
                                    <button class="btn-sm" onclick="editPost('${file.name}')">Edit</button>
                                    <button class="btn-sm btn-danger" onclick="deletePost('${file.name}', '${file.sha}')">Delete</button>
                                </div>
                            </div>
                        `;
                    }
                }
                listDiv.innerHTML = html;
            } catch(e) {
                listDiv.innerHTML = `<p style="color: var(--danger);">Error loading posts: ${e.message}</p>`;
            }
        }

        async function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const slug = document.getElementById('postSlug').value.trim() || title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const desc = document.getElementById('metaDesc').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const editFilename = document.getElementById('editFilename').value;
            const editSha = document.getElementById('editSha').value;
            const msgEl = document.getElementById('actionMsg');

            if(!title || !content) {
                msgEl.style.color = "var(--danger)";
                msgEl.innerText = "Please fill in title and content!";
                return;
            }

            const filename = editFilename ? editFilename : `_posts/${new Date().toISOString().split('T')[0]}-${slug}.md`;
            const fileContent = `---\ntitle: "${title}"\ndescription: "${desc}"\ndate: ${new Date().toISOString()}\n---\n\n${content}`;
            const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

            msgEl.style.color = "var(--text-muted)";
            msgEl.innerText = "Publishing to GitHub...";

            try {
                let bodyData = {
                    message: editFilename ? `Update article: ${title}` : `Create article: ${title}`,
                    content: encodedContent
                };
                if(editSha) bodyData.sha = editSha;

                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${filename}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${authData.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if(res.ok) {
                    msgEl.style.color = "var(--success)";
                    msgEl.innerText = "Article successfully published!";
                    setTimeout(() => {
                        document.getElementById('postTitle').value = '';
                        document.getElementById('postSlug').value = '';
                        document.getElementById('metaDesc').value = '';
                        document.getElementById('postContent').value = '';
                        document.getElementById('editFilename').value = '';
                        document.getElementById('editSha').value = '';
                        msgEl.innerText = '';
                        switchTab('manage');
                    }, 1200);
                } else {
                    const err = await res.json();
                    throw new Error(err.message || "Publish failed");
                }
            } catch(e) {
                msgEl.style.color = "var(--danger)";
                msgEl.innerText = "Error: " + e.message;
            }
        }

        async function editPost(filename) {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/_posts/${filename.replace('_posts/', '')}`, {
                    headers: { 'Authorization': `token ${authData.token}` }
                });
                const data = await res.json();
                const decoded = decodeURIComponent(escape(atob(data.content)));
                
                document.getElementById('editFilename').value = data.path;
                document.getElementById('editSha').value = data.sha;
                
                // Extract frontmatter / content roughly
                document.getElementById('postTitle').value = filename.replace('.md','');
                document.getElementById('postContent').value = decoded;
                
                switchTab('create');
            } catch(e) {
                alert("Could not load post for editing.");
            }
        }

        async function deletePost(filename, sha) {
            if(!confirm(`Are you sure you want to delete ${filename}?`)) return;
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/_posts/${filename.replace('_posts/', '')}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${authData.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete article: ${filename}`,
                        sha: sha
                    })
                });
                if(res.ok) {
                    loadPosts();
                } else {
                    throw new Error("Delete failed");
                }
            } catch(e) {
                alert("Error deleting post: " + e.message);
            }
        }
    </script>
</body>
</html>
