<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1c"><meta name="robots" content="index,follow">
<title>Article | ProEditsAPK</title>
<meta name="description" content="Explore Android apps, video editing tools and AI apps on ProEditsAPK.">
<link rel="canonical" href="https://proeditsapk.com/article.html">
<meta property="og:site_name" content="ProEditsAPK"><meta property="og:type" content="article">
<style>
:root{color-scheme:dark;--bg:#080d1c;--panel:#101a30;--line:#233452;--text:#eef4ff;--muted:#9aabc6;--blue:#48a9ff;--cyan:#50e0dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#132c50 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.75 Inter,system-ui,-apple-system,sans-serif}a{color:var(--cyan)}header{border-bottom:1px solid var(--line);padding:18px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:21px;letter-spacing:-.7px;color:white;text-decoration:none}.brand span{color:var(--cyan)}main{width:min(850px,90%);margin:52px auto 90px}.back{color:var(--cyan);text-decoration:none;font-weight:650}.article{margin-top:26px;background:#0e1729;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,54px);overflow-wrap:anywhere}.meta{color:var(--muted);font-size:14px}.article h1{font-size:clamp(30px,6vw,48px);line-height:1.15;letter-spacing:-1.5px}.article h2{margin-top:2em}.article img{max-width:100%;height:auto;border-radius:14px}.article pre{overflow:auto;background:#070b15;padding:16px;border-radius:12px}.article code{overflow-wrap:anywhere}.article blockquote{border-left:3px solid var(--blue);padding-left:18px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:28px;border-top:1px solid var(--line)}.error{color:#ffb5b5}
</style>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
</head>
<body><header><a class="brand" href="/">ProEdits<span>APK</span></a><a class="back" href="/">← All articles</a></header>
<main><a class="back" href="/">← Back to home</a><article id="article" class="article"><p>Loading article…</p></article></main><footer>© <span id="year"></span> ProEditsAPK · Apps, editing & AI guides</footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
(async()=>{const box=document.getElementById('article');const path=new URLSearchParams(location.search).get('path')||'';if(!/^_posts\/[a-zA-Z0-9._-]+\.md$/.test(path)){box.innerHTML='<h1>Article not found</h1><p class="error">Please choose an article from the homepage.</p>';return}
try{const url='https://raw.githubusercontent.com/haseebaslam091-afk/proeditsapk/main/'+path;const res=await fetch(url);if(!res.ok)throw Error('Article could not be loaded');let md=await res.text();let title=path.split('/').pop().replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'').replace(/[-_]/g,' ');let date='';const fm=md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);if(fm){const t=fm[1].match(/^title:\s*["']?(.+?)["']?\s*$/m);const d=fm[1].match(/^date:\s*(.+)$/m);if(t)title=t[1].replace(/^["']|["']$/g,'');if(d)date=d[1];md=md.slice(fm[0].length)}document.title=title+' | ProEditsAPK';document.querySelector('meta[name="description"]').content='Read '+title+' on ProEditsAPK: Android apps, video editing and AI tools.';box.innerHTML='<div class="meta">'+(date||'ProEditsAPK Guide')+'</div><h1>'+DOMPurify.sanitize(title)+'</h1>'+DOMPurify.sanitize(marked.parse(md),{USE_PROFILES:{html:true}})}catch(e){box.innerHTML='<h1>Unable to load article</h1><p class="error">Please refresh the page or return to the homepage.</p>'}})();
</script></body></html>
