<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - ProEditsAPK</title>
    <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Schema.org SoftwareApplication Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "{{ page.title }}",
      "operatingSystem": "ANDROID",
      "applicationCategory": "MultimediaApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --accent: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; line-height: 1.6; }

        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            padding: 16px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; }

        .article-container { max-width: 850px; margin: 40px auto; padding: 0 20px; }
        
        .post-header { text-align: center; margin-bottom: 30px; }.post-app-icon { width:104px;height:104px;object-fit:contain;border-radius:22px;background:#fff;padding:10px;margin:0 auto 16px;display:block;box-shadow:0 10px 30px #0005; }
        .badge { background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 12px; }
        .post-title { font-size: 32px; font-weight: 800; margin-bottom: 10px; line-height: 1.3; }
        .post-meta { font-size: 13px; color: var(--text-muted); }

        .download-box {
            background: var(--card-bg);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin: 30px 0;
        }

        .btn-download-large {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 16px 36px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 18px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .btn-download-large:hover { transform: translateY(-2px); }

        .content { font-size: 16px; color: #cbd5e1; font-weight: 400; }
        .content h2 { color: #f8fafc; font-size: 22px; margin: 30px 0 15px; border-left: 4px solid var(--primary); padding-left: 12px; }
        .content p { margin-bottom: 18px; }
        .content ul { margin: 15px 0 20px 25px; }
        .content li { margin-bottom: 8px; }

        footer { text-align: center; margin-top: 60px; color: var(--text-muted); font-size: 13px; }
    </style>

<style>
:root{color-scheme:dark;--bg-dark:#06050f;--card-bg:rgba(18,14,34,.88);--primary:#a855f7;--accent:#38bdf8;--text-main:#f8f7ff;--text-muted:#aaa7bd;--glass-border:rgba(192,132,252,.18)}
*{font-family:'Plus Jakarta Sans',sans-serif}
body{background:radial-gradient(ellipse at 50% 0,#26113f 0,transparent 38%),#06050f;color:var(--text-main)}
header{background:#080714eF;border-color:#29243f;padding:18px max(22px,calc((100% - 1080px)/2))}
.logo{background:linear-gradient(120deg,#c084fc,#60a5fa);-webkit-background-clip:text}
.back-btn{color:#c4b5fd}
.article-container{max-width:900px;margin:46px auto}
.post-header{padding:42px 28px 34px;border:1px solid #35264c;border-radius:28px;background:radial-gradient(ellipse at 50% 0,#432064 0,transparent 60%),linear-gradient(145deg,#121020,#090914);box-shadow:0 20px 60px #0008}
.post-app-icon{width:126px;height:126px;border-radius:28px;box-shadow:0 0 42px #a855f766}
.badge{background:#18372f;color:#6ee7b7;letter-spacing:1px}
.post-title{font-size:clamp(30px,5vw,48px);letter-spacing:-1.6px;line-height:1.15}
.post-meta{color:#aaa7bd}
.download-box{border:1px solid #543276;border-radius:23px;background:radial-gradient(ellipse at 50% 0,#37164f 0,transparent 70%),#100d1d;padding:30px}
.btn-download-large{background:linear-gradient(120deg,#9333ea,#4f46e5);box-shadow:0 10px 28px #7c3aed55;border-radius:15px}
.content{font-size:16px;color:#c7c3d5;background:#0d0b18;border:1px solid #27223b;border-radius:23px;padding:clamp(22px,5vw,42px);line-height:1.85}
.content h2{color:#f8f7ff;border-color:#a855f7}
.content a{color:#c084fc}
footer{color:#aaa7bd}
@media(max-width:620px){.article-container{margin:22px auto}.post-header{padding:30px 18px 25px;border-radius:22px}.post-title{font-size:30px}.download-box{padding:22px 16px}.btn-download-large{font-size:15px;padding:14px 22px}.content{font-size:15px;padding:22px 18px}}
</style></head>
<body>

    <header>
        <a href="/" class="logo">ProEditsAPK</a>
        <a href="/" class="back-btn">← Back to Home</a>
    </header>

    <main class="article-container">
        <div class="post-header">
            <img class="post-app-icon" src="/api/app-icon?q={{ page.title | url_encode }}" alt="{{ page.title | escape }} app icon" loading="eager" decoding="async" onerror="this.style.display='none'">
            <span class="badge">100% Tested & Safe</span>
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">Updated: {{ page.date | date_to_string }} | By ProEditsAPK Team</div>
        </div>

        <div class="download-box">
            <h3 style="margin-bottom: 8px;">Direct Download File</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Verified Virus-Free & Unlocked Premium Version</p>
            <a href="{{ page.download_link | default: '#' }}" class="btn-download-large" target="_blank">Download APK Now ⚡</a>
        </div>

        <article class="content">
            {{ content }}
        </article>
    </main>

    <footer>
        <p>© 2026 ProEditsAPK. All rights reserved.</p>
    </footer>

</body>
</html>
