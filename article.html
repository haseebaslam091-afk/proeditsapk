:root{color-scheme:dark;--bg:#050b20;--panel:#091632;--line:#1b3c68;--text:#f3f7ff;--muted:#a9bfdf;--blue:#078cff;--cyan:#83eaff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% 0,#102e69 0,transparent 34%),var(--bg);color:var(--text);font:16px/1.8 Inter,system-ui,-apple-system,sans-serif}a{color:var(--cyan)}header{position:sticky;top:0;z-index:5;border-bottom:1px solid #1b3c68;background:#050b20e8;backdrop-filter:blur(16px);padding:15px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px;letter-spacing:-.7px;color:white;text-decoration:none}.brand span{color:#00d9ee}.back{color:#83eaff;text-decoration:none;font-weight:700}main{width:min(880px,92%);margin:40px auto 80px}.article{margin-top:18px;background:linear-gradient(145deg,#0b1933,#071226);border:1px solid #1b3c68;border-radius:24px;padding:clamp(22px,5vw,56px);overflow-wrap:anywhere;box-shadow:0 25px 75px #0006}.article .meta{color:#9bb6d8;font-size:13px}.article h1{font-size:clamp(32px,6vw,52px);line-height:1.13;letter-spacing:-1.6px;color:#8be7ff;text-shadow:0 0 12px #35caff8c,0 0 30px #078cff55;margin:14px 0 28px}.article h2{position:relative;margin:2.1em 0 .75em;padding:12px 15px;border-left:3px solid #23c9ff;border-radius:0 11px 11px 0;background:linear-gradient(90deg,#0b3761a8,transparent 88%);color:#b9efff;font-size:clamp(21px,3.5vw,27px);line-height:1.35;text-shadow:0 0 14px #078cff45}.article h3{color:#d5f5ff;margin-top:1.7em}.heading-icon{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:9px;border-radius:8px;background:#0b3b68;border:1px solid #168dd4;color:#8be7ff;font-size:15px;vertical-align:middle;box-shadow:0 0 12px #078cff35}.article img{max-width:100%;height:auto;border-radius:14px}.article pre{overflow:auto;background:#050b18;padding:16px;border-radius:12px}.article code{overflow-wrap:anywhere}.article blockquote{border-left:3px solid var(--blue);padding-left:18px;color:var(--muted)}.article p,.article li{color:#c2d2e8}.article strong{color:#effaff}.article a{color:#65dcff}.article ul,.article ol{padding-left:24px}.article li::marker{color:#28caff}footer{text-align:center;color:#91a8c9;padding:28px;border-top:1px solid var(--line);font-size:13px}.error{color:#ffb5b5}
@media(max-width:600px){header{padding:13px 4%}.brand{font-size:19px}main{margin:25px auto 55px}.article{border-radius:17px;padding:21px 17px}.article h1{font-size:32px}.article h2{margin-top:1.7em;padding:10px 11px}.heading-icon{width:24px;height:24px;font-size:13px}}

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>

<body><header><a class="brand" href="/">ProEdits<span>APK</span></a><a class="back" href="/">← All articles</a></header>
<main><a class="back" href="/">← Back to home</a><article id="article" class="article"><p>Loading article…</p></article></main><footer>© <span id="year"></span> ProEditsAPK · Apps, editing & AI guides</footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
function decorateHeadings(root){const icons=[[/apk|download|install/i,'⇩'],[/android|phone|device/i,'▣'],[/feature|tool|edit/i,'✦'],[/step|how to|guide/i,'➜'],[/requirement|compatib|version/i,'✓'],[/privacy|security|permission/i,'⬡'],[/overview|introduction/i,'◈'],[/ai|artificial|smart/i,'✧'],[/tip|note|important/i,'!']];root.querySelectorAll('h2,h3').forEach(h=>{if(h.querySelector('.heading-icon'))return;const t=h.textContent;const match=icons.find(([re])=>re.test(t));const span=document.createElement('span');span.className='heading-icon';span.setAttribute('aria-hidden','true');span.textContent=match?match[1]:'✧';h.prepend(span)})}
(async()=>{const box=document.getElementById('article');const path=document.querySelector('meta[name="article-path"]').content||new URLSearchParams(location.search).get('path')||'';document.getElementById('canonical').href=location.href.split('#')[0];if(!/^_posts\/[a-zA-Z0-9._-]+\.md$/.test(path)){box.innerHTML='<h1>Article not found</h1><p class="error">Please choose an article from the homepage.</p>';return}
try{const res=await fetch('/api/article?path='+encodeURIComponent(path),{cache:'no-store'});if(!res.ok)throw Error('Article could not be loaded ('+res.status+')');const payload=await res.json();let md=String(payload.content||'');let title=path.split('/').pop().replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'').replace(/[-_]/g,' ');let date='';const fm=md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);if(fm){const t=fm[1].match(/^title:\s*["']?(.+?)["']?\s*$/m);const d=fm[1].match(/^date:\s*(.+)$/m);if(t)title=t[1].replace(/^["']|["']$/g,'');if(d)date=d[1];md=md.slice(fm[0].length)}document.title=title+' | ProEditsAPK';document.querySelector('meta[name="description"]').content='Read '+title+' on ProEditsAPK: Android apps, video editing and AI tools.';box.innerHTML='<div class="meta">'+(date||'ProEditsAPK Guide')+'</div><h1>'+DOMPurify.sanitize(title)+'</h1>'+DOMPurify.sanitize(marked.parse(md),{USE_PROFILES:{html:true}});const v=document.createElement('div');v.className='post-visual';const photo=document.createElement('img');photo.alt=title+' app preview';const fb=document.createElement('span');fb.className='post-icon-fallback';fb.textContent=title.replace(/[^a-z0-9]/gi,'').slice(0,3).toUpperCase()||'APP';const icon=document.createElement('img');icon.className='post-icon';icon.alt=title+' official app icon';icon.hidden=true;icon.referrerPolicy='no-referrer';icon.onload=()=>{icon.hidden=false;fb.hidden=true};icon.onerror=()=>{icon.hidden=true;fb.hidden=false};v.append(photo,fb,icon);box.insertBefore(v,box.firstChild);const savedThumb=String(payload.generatedThumbnailUrl||payload.thumbnailUrl||'');if(/^https:\/\//.test(savedThumb)||/^\/assets\/generated-thumbnails\/[a-z0-9-]+\.jpg$/.test(savedThumb))photo.src=savedThumb;if(/^https:\/\/(play-lh|lh3)\.googleusercontent\.com\//.test(payload.iconUrl||''))icon.src=payload.iconUrl;else await fetch('/api/app-media?title='+encodeURIComponent(title),{cache:'force-cache'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&/^https:\/\/(play-lh|lh3)\.googleusercontent\.com\//.test(d.iconUrl||''))icon.src=d.iconUrl}).catch(()=>{});decorateHeadings(box);}catch(e){box.innerHTML='<h1>Unable to load article</h1><p class="error">Please refresh the page or return to the homepage.</p>'}})();
</script></body></html>
