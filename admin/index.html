<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProEditsAPK - Professional 3D CMS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #eab308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 980px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            padding: 30px;
        }

        .login-box { text-align: center; max-width: 450px; margin: 0 auto; }
        .login-box h1 {
            font-size: 28px; margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-box p { color: var(--text-muted); margin-bottom: 30px; font-size: 14px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); }

        input, textarea {
            width: 100%; padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text-main); font-size: 15px; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;
        }
        .dashboard-header h2 {
            font-size: 22px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-logout { width: auto; padding: 8px 16px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; font-size: 14px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn {
            flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border); color: var(--text-muted); border-radius: 10px; cursor: pointer; font-weight: 600;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .action-buttons-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-draft { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); color: #fde047; flex: 1; }
        .msg { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- LOGIN VIEW -->
        <div id="loginView" class="login-box">
            <h1>ProEditsAPK CMS</h1>
            <p>Security Verification Login</p>
            <div class="input-group">
                <label>Question: Haseeb Life kon he?</label>
                <input type="text" id="secAnswer" placeholder="Enter security answer">
            </div>
            <div class="input-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="token" placeholder="Paste GitHub token">
            </div>
            <button type="button" id="loginBtn">Login to Dashboard</button>
            <div id="loginMsg" class="msg" style="color: var(--danger);"></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboardView" style="display: none;">
            <div class="dashboard-header">
                <h2>ProEditsAPK Control Center</h2>
                <button type="button" class="btn-logout" id="logoutBtn">Logout</button>
            </div>

            <div class="tabs">
                <button type="button" class="tab-btn active" id="tabCreateBtn">New Article</button>
                <button type="button" class="tab-btn" id="tabManageBtn">Manage Articles</button>
            </div>

            <!-- CREATE TAB -->
            <div id="createTab" class="tab-content active">
                <div class="input-group">
                    <label>Article Title</label>
                    <input type="text" id="postTitle" placeholder="Enter article title">
                </div>
                <div class="input-group">
                    <label>URL Slug</label>
                    <input type="text" id="postSlug" placeholder="enter-article-slug">
                </div>
                <div class="input-group">
                    <label>Meta Description</label>
                    <input type="text" id="metaDesc" placeholder="Short description">
                </div>
                <div class="input-group">
                    <label>Article Content</label>
                    <textarea id="postContent" rows="10" placeholder="Write content here..."></textarea>
                </div>

                <div class="action-buttons-group">
                    <button type="button" class="btn-draft" id="saveDraftBtn">💾 Save as Draft</button>
                    <button type="button" id="publishLiveBtn">⚡ Publish Live Article</button>
                </div>
                <div id="actionMsg" class="msg"></div>
            </div>

            <!-- MANAGE TAB -->
            <div id="manageTab" class="tab-content">
                <h3 style="margin-bottom: 15px; font-size: 16px; color: var(--text-muted);">All Files in Repository</h3>
                <div id="postsList">Loading files...</div>
            </div>
        </div>
    </div>

    <script>
        const REPO = "haseebasam091/proeditsapk";
        const SECURITY_ANSWER = "Laadi Wifoxo";

        let authData = JSON.parse(localStorage.getItem('proedits_auth') || 'null');

        document.addEventListener("DOMContentLoaded", () => {
            if (authData) showDashboard();

            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            document.getElementById('tabCreateBtn').addEventListener('click', () => switchTab('create'));
            document.getElementById('tabManageBtn').addEventListener('click', () => switchTab('manage'));

            document.getElementById('saveDraftBtn').addEventListener('click', () => publishPost(true));
            document.getElementById('publishLiveBtn').addEventListener('click', () => publishPost(false));
        });

        function handleLogin() {
            const ans = document.getElementById('secAnswer').value.trim();
            const t = document.getElementById('token').value.trim();

            if (ans.toLowerCase() === SECURITY_ANSWER.toLowerCase() && t.length > 5) {
                authData = { token: t };
                localStorage.setItem('proedits_auth', JSON.stringify(authData));
                showDashboard();
            } else {
                document.getElementById('loginMsg').innerText = "Ghalat jawab ya token!";
            }
        }

        function handleLogout() {
            localStorage.removeItem('proedits_auth');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadPosts();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'create') {
                document.getElementById('tabCreateBtn').classList.add('active');
                document.getElementById('createTab').classList.add('active');
            } else {
                document.getElementById('tabManageBtn').classList.add('active');
                document.getElementById('manageTab').classList.add('active');
                loadPosts();
            }
        }

        async function loadPosts() {
            const listDiv = document.getElementById('postsList');
            listDiv.innerHTML = "Fetching files...";
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents`, {
                    headers: { 'Authorization': `token ${authData.token}` }
                });

                if(!res.ok) throw new Error("Repository access failed");
                const files = await res.json();
                
                let html = '';
                for(let file of files) {
                    html += `<div class="post-card" style="padding:10px; margin-bottom:8px; background:rgba(255,255,255,0.05); border-radius:8px;">${file.name}</div>`;
                }
                listDiv.innerHTML = html || "No files found.";
            } catch(e) {
                listDiv.innerHTML = `<p style="color: var(--danger);">Error: Repository nahi mili ya token ghalat hai.</p>`;
            }
        }

        async function publishPost(isDraft = false) {
            const title = document.getElementById('postTitle').value.trim();
            const slug = document.getElementById('postSlug').value.trim() || title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const desc = document.getElementById('metaDesc').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const msgEl = document.getElementById('actionMsg');

            if(!title || !content) {
                msgEl.style.color = "var(--danger)";
                msgEl.innerText = "Title aur content lazmi likhein!";
                return;
            }

            const fileName = isDraft ? `draft-${slug}.md` : `post-${slug}.md`;
            const fileContent = `---\ntitle: "${title}"\ndescription: "${desc}"\n---\n\n${content}`;
            const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

            msgEl.style.color = "var(--text-muted)";
            msgEl.innerText = "Saving file to GitHub...";

            try {
                // Direct PUT request bina kisi check ke (Error 404 se bachne ke liye)
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${authData.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `CMS Save: ${title}`,
                        content: encodedContent
                    })
                });

                if(res.ok) {
                    msgEl.style.color = "var(--success)";
                    msgEl.innerText = "Kamyabi se save ho gaya!";
                    setTimeout(() => {
                        document.getElementById('postTitle').value = '';
                        document.getElementById('postSlug').value = '';
                        document.getElementById('metaDesc').value = '';
                        document.getElementById('postContent').value = '';
                        msgEl.innerText = '';
                        switchTab('manage');
                    }, 1500);
                } else {
                    const errData = await res.json();
                    throw new Error(errData.message || "Save fail ho gaya");
                }
            } catch(e) {
                msgEl.style.color = "var(--danger)";
                msgEl.innerText = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
