<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b20">
<meta name="description" content="Browse all ProEditsAPK Android app guides, video editing tools and AI app articles.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://proeditsapk.com/articles/">
<link rel="icon" type="image/svg+xml" href="/assets/proeditsapk-logo.svg">
<title>All Articles & App Guides | ProEditsAPK</title>
<style>
:root{color-scheme:dark;--bg:#050b20;--panel:#091632;--line:#1b3c68;--text:#f3f7ff;--muted:#a9bfdf;--cyan:#00d9ee}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#102e69 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1100px,92%);margin:auto}
header{position:sticky;top:0;z-index:5;background:#050b20e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900}.brand span{color:var(--cyan)}.back{color:#83eaff;font-weight:700}
main{padding:42px 0 70px}.eyebrow{color:#8beaff;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:850}
h1{font-size:clamp(34px,6vw,54px);line-height:1.08;letter-spacing:-1.8px;margin:8px 0}.intro{color:var(--muted);max-width:620px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.controls input,.controls select{min-height:46px;border:1px solid #28517d;border-radius:12px;background:#06132b;color:white;padding:0 14px;font:inherit}.controls input{flex:1;min-width:220px}.controls select{min-width:160px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{min-width:0;overflow:hidden;border:1px solid #254b78;border-radius:17px;background:linear-gradient(145deg,#0d2042,#07132b);box-shadow:0 12px 30px #0005;display:flex;flex-direction:column}
.visual{height:160px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 45% 45%,#1479d9,#10134c 70%);color:#d9faff;font-size:42px;font-weight:900}.visual img{width:100%;height:100%;object-fit:cover}.icon{position:absolute;right:13px;bottom:12px;width:54px;height:54px;border-radius:14px;padding:4px;display:grid;place-items:center;background:#07172fee;border:1px solid #80dfff88}.icon img{width:100%;height:100%;object-fit:contain}.body{padding:16px;display:flex;flex-direction:column;flex:1}.tag{align-self:flex-start;border-radius:20px;padding:3px 9px;background:#087cff;color:#fff;font-size:10px;font-weight:850}.tag.ai{background:#7829cf}.tag.android{background:#168d54}h2{font-size:18px;line-height:1.3;margin:10px 0 7px}.body p{color:#bdd0e9;font-size:13px;margin:0 0 15px}.open{margin-top:auto;align-self:flex-start;color:#00d7f4;font-weight:850;font-size:12px;letter-spacing:.5px}.empty{grid-column:1/-1;border:1px dashed #28517d;border-radius:15px;padding:24px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.visual{height:130px}.body{padding:13px}h2{font-size:15px}.body p{font-size:12px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.visual{height:175px}.body{padding:16px}h2{font-size:17px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/">▶ ProEdits<span>APK</span></a><a class="back" href="/">← Home</a></div></header>
<main class="wrap">
<div class="eyebrow">ProEditsAPK Library</div><h1>All Articles & App Guides</h1>
<p class="intro">Explore Android apps, video editing tools and AI guides. Search the library or filter by category to find the right guide.</p>
<div class="controls"><input id="search" type="search" placeholder="Search all articles…" aria-label="Search all articles"><select id="category" aria-label="Filter by category"><option value="">All categories</option><option value="Android Apps">Android Apps</option><option value="Video Editing">Video Editing</option><option value="AI Tools">AI Tools</option></select></div>
<section id="articles" class="grid" aria-live="polite"><div class="empty">Loading articles…</div></section>
</main>
<footer><div class="wrap">© <span id="year"></span> ProEditsAPK · <a href="/privacy-policy.html">Privacy</a> · <a href="/contact.html">Contact</a></div></footer>
<script>
const $=id=>document.getElementById(id);$('year').textContent=new Date().getFullYear();let posts=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function category(p){const s=(String(p.title||'')+' '+String(p.category||'')).toLowerCase();if(/capcut|vivacut|video|editor|popmaker/.test(s))return 'Video Editing';if(/ai|artificial|generator/.test(s))return 'AI Tools';return 'Android Apps'}
function slug(p){return String(p.slug||p.title||'').toLowerCase().replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90)}
function render(){const q=$('search').value.trim().toLowerCase(),c=$('category').value;const found=posts.filter(p=>(!c||category(p)===c)&&((String(p.title||'')+' '+String(p.excerpt||'')+' '+String(p.description||'')+' '+String(p.tags||'')+' '+category(p)).toLowerCase().includes(q)));if(!found.length){$('articles').innerHTML='<div class="empty">No matching articles found. Try another search or category.</div>';return}
$('articles').innerHTML=found.map(p=>{const title=String(p.title||'Untitled'),s=slug(p),cat=category(p),url='/articles/'+encodeURIComponent(s),icon=String(p.officialIconUrl||p.iconUrl||''),thumb=String(p.thumbnailUrl||p.generatedThumbnailUrl||''),initial=title.replace(/[^a-z0-9]/gi,'').slice(0,3).toUpperCase()||'APP';const validIcon=/^https:\/\//.test(icon)||/^\/media\/icons\/[a-z0-9-]+(?:\?v=[a-zA-Z0-9%._-]+)?$/.test(icon)||/^\/assets\/app-icons\/[a-zA-Z0-9._-]+$/.test(icon);const validThumb=/^https:\/\//.test(thumb)||/^\/assets\/generated-thumbnails\/[a-z0-9-]+\.png$/.test(thumb)||/^\/media\/library\/[0-9a-f-]{36}$/i.test(thumb);return '<article class="card"><div class="visual">'+(validThumb?'<img src="'+esc(thumb)+'" alt="" loading="lazy" onerror="this.remove()">':'<span>'+esc(initial)+'</span>')+(validIcon?'<span class="icon"><img src="'+esc(icon)+'" alt="" loading="lazy" onerror="this.parentElement.remove()"></span>':'')+'</div><div class="body"><span class="tag '+(cat==='AI Tools'?'ai':cat==='Android Apps'?'android':'')+'">'+esc(cat)+'</span><h2>'+esc(title)+'</h2><p>'+esc(String(p.excerpt||p.description||'Read this app guide on ProEditsAPK.').slice(0,180))+'</p><a class="open" href="'+url+'">READ GUIDE & DOWNLOAD →</a></div></article>'}).join('')}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);
(async()=>{try{const r=await fetch('/posts.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data))throw Error();posts=data.filter(p=>p&&p.published!==false&&/^_posts\/[a-zA-Z0-9._-]+\.md$/.test(String(p.path||''))&&/^[a-z0-9-]{3,90}$/.test(slug(p)));const select=$('category'),categories=[...new Set(posts.map(category))].sort();for(const name of categories){if(![...select.options].some(option=>option.value===name)){const option=document.createElement('option');option.value=name;option.textContent=name;select.append(option)}}render()}catch(e){$('articles').innerHTML='<div class="empty">Articles are temporarily unavailable. Please try again shortly.</div>'}})();
</script>
</body></html>
