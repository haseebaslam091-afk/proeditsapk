function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fallbackMarkdown(source){

}
function sanitizeArticleHTML(source){

 const template=document.createElement('template');template.innerHTML=converted;
 const allowed=new Set(['P','H1','H2','H3','H4','H5','H6','UL','OL','LI','STRONG','B','EM','I','U','S','DEL','BLOCKQUOTE','A','IMG','FIGURE','HR','BR','TABLE','THEAD','TBODY','TR','TH','TD','PRE','CODE']);

  if(node.tagName==='A'){try{const u=new URL(node.getAttribute('href')||'',location.origin);if(!['https:','mailto:'].includes(u.protocol))throw Error();node.href=u.href;node.rel='noopener noreferrer'}catch(e){node.removeAttribute('href')}}

function decorateHeadings(root){const icons=[[/apk|download|install/i,'⇩'],[/android|phone|device/i,'▣'],[/feature|tool|edit/i,'✦'],[/step|how to|guide/i,'➜'],[/requirement|compatib|version/i,'✓'],[/privacy|security|permission/i,'⬡'],[/overview|introduction/i,'◈'],[/ai|artificial|smart/i,'✧'],[/tip|note|important/i,'!']];root.querySelectorAll('h2,h3').forEach(h=>{if(h.querySelector('.heading-icon'))return;const t=h.textContent;const match=icons.find(([re])=>re.test(t));const span=document.createElement('span');span.className='heading-icon';span.setAttribute('aria-hidden','true');span.textContent=match?match[1]:'✧';h.prepend(span)})}
