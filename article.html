<body><header><a class="brand" href="/">ProEdits<span>APK</span></a><a class="back" href="/">← All articles</a></header>
<main><a class="back" href="/">← Back to home</a><article id="article" class="article"><p>Loading article…</p></article></main><footer>© <span id="year"></span> ProEditsAPK · Apps, editing & AI guides</footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
function decorateHeadings(root){const icons=[[/apk|download|install/i,'⇩'],[/android|phone|device/i,'▣'],[/feature|tool|edit/i,'✦'],[/step|how to|guide/i,'➜'],[/requirement|compatib|version/i,'✓'],[/privacy|security|permission/i,'⬡'],[/overview|introduction/i,'◈'],[/ai|artificial|smart/i,'✧'],[/tip|note|important/i,'!']];root.querySelectorAll('h2,h3').forEach(h=>{if(h.querySelector('.heading-icon'))return;const t=h.textContent;const match=icons.find(([re])=>re.test(t));const span=document.createElement('span');span.className='heading-icon';span.setAttribute('aria-hidden','true');span.textContent=match?match[1]:'✧';h.prepend(span)})}
(async()=>{const box=document.getElementById('article');const path=document.querySelector('meta[name="article-path"]').content||new URLSearchParams(location.search).get('path')||'';document.getElementById('canonical').href=location.href.split('#')[0];if(!/^_posts\/[a-zA-Z0-9._-]+\.md$/.test(path)){box.innerHTML='<h1>Article not found</h1><p class="error">Please choose an article from the homepage.</p>';return}
try{const url='https://raw.githubusercontent.com/haseebaslam091-afk/proeditsapk/main/'+path;const res=await fetch(url);if(!res.ok)throw Error('Article could not be loaded');let md=await res.text();let title=path.split('/').pop().replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'').replace(/[-_]/g,' ');let date='';const fm=md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);if(fm){const t=fm[1].match(/^title:\s*["']?(.+?)["']?\s*$/m);const d=fm[1].match(/^date:\s*(.+)$/m);if(t)title=t[1].replace(/^["']|["']$/g,'');if(d)date=d[1];md=md.slice(fm[0].length)}document.title=title+' | ProEditsAPK';document.querySelector('meta[name="description"]').content='Read '+title+' on ProEditsAPK: Android apps, video editing and AI tools.';box.innerHTML='<div class="meta">'+(date||'ProEditsAPK Guide')+'</div><h1>'+DOMPurify.sanitize(title)+'</h1>'+DOMPurify.sanitize(marked.parse(md),{USE_PROFILES:{html:true}});decorateHeadings(box);const iconWrap=document.createElement('div');iconWrap.className='post-app-fallback';iconWrap.textContent=title.replace(/[^a-z0-9]/gi,'').slice(0,4).toUpperCase()||'APP';box.insertBefore(iconWrap,box.firstChild);try{const iconResponse=await fetch('/api/app-icon?title='+encodeURIComponent(title));if(iconResponse.ok){const iconData=await iconResponse.json();if(/^https:\/\/(play-lh|lh3)\.googleusercontent\.com\//.test(iconData.iconUrl||'')){const iconImage=document.createElement('img');iconImage.className='post-app-icon';iconImage.src=iconData.iconUrl;iconImage.alt=title+' official app icon';iconImage.referrerPolicy='no-referrer';iconImage.onerror=()=>iconImage.replaceWith(iconWrap);iconWrap.replaceWith(iconImage)}}}catch(e){/* Keep the designed initials fallback. */}}catch(e){box.innerHTML='<h1>Unable to load article</h1><p class="error">Please refresh the page or return to the homepage.</p>'}})();
</script></body></html>
