name: Validate website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker, Admin and Wrangler configuration
        run: node scripts/check.mjs
