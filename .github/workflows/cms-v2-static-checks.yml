name: CMS 2.0 static checks

on:
  push:
    branches:
      - cms-v2-db-crud-polish
    paths:
      - "cms-v2/**"
      - ".github/workflows/cms-v2-static-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cms-v2/**"
      - ".github/workflows/cms-v2-static-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    name: Validate CMS 2.0 foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run CMS static checks
        run: node cms-v2/tests/static-check.mjs
