backend:
  name: github
  repo: haseebasam091/proeditsapk
  branch: main
  client_id: Ov23libR0ZhPUsKrDZPn
  base_url: https://decap-oauth-provider-node.vercel.app
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "APK Posts"
    folder: "_posts"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
