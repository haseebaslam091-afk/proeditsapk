<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProEditsAPK - Premium Editing Apps & Mod APKs</title>
    <meta name="description" content="Download the latest fully unlocked, ad-free Pro Editing Apps, Video Editors, and Mod APKs with high speed downloads.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }

        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            padding: 16px 24px;
            display: flex; justify-content: center; align-items: center;
        }

        .logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }

        .hero { text-align: center; padding: 50px 20px 30px; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 36px; font-weight: 800; margin-bottom: 12px; }
        .hero p { color: var(--text-muted); font-size: 15px; margin-bottom: 25px; }

        .search-box input {
            width: 100%; max-width: 450px; padding: 14px 20px; background: rgba(30, 41, 59, 0.8); border: 1px solid var(--glass-border); border-radius: 14px; color: white; font-size: 15px; outline: none;
        }

        .container { max-width: 1100px; margin: 30px auto 0; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px; text-decoration: none; color: var(--text-main); display: flex; flex-direction: column; justify-content: space-between;
        }
        .card:hover { border-color: rgba(99, 102, 241, 0.5); }

        .card-badge { background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; width: fit-content; margin-bottom: 10px; }
        .card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .card p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #64748b; border-top: 1px solid var(--glass-border); padding-top: 12px; }
        .btn-download { background: var(--primary); color: white; padding: 6px 12px; border-radius: 8px; font-weight: 700; }

        footer { text-align: center; margin-top: 60px; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">ProEditsAPK</a>
    </header>

    <section class="hero">
        <h1>Unlocked Pro Editing Apps & Media Tools</h1>
        <p>Direct high-speed downloads, ad-free Mod APKs, and complete editing guides.</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search apps (e.g. Kinemaster, CapCut)..." onkeyup="filterApps()">
        </div>
    </section>

    <main class="container">
        <h2 style="font-size: 20px;">🔥 Latest Published Apps</h2>
        <div class="grid" id="appsGrid">
            <p style="color: var(--text-muted);">Loading latest posts...</p>
        </div>
    </main>

    <footer>
        <p>© 2026 ProEditsAPK. All rights reserved.</p>
    </footer>

    <script>
        async function fetchPosts() {
            const grid = document.getElementById('appsGrid');
            try {
                const res = await fetch('https://api.github.com/repos/haseebaslam091-afk/proeditsapk/contents/_posts');
                if(!res.ok) throw new Error("No posts found");
                
                const files = await res.json();
                let html = '';

                for(let file of files) {
                    if(file.name.endsWith('.md') || file.name.endsWith('.html')) {
                        const cleanSlug = file.name.replace(/\.md$/, '').replace(/\.html$/, '').replace(/^\d{4}-\d{2}-\d{2}-/, '');
                        const displayTitle = cleanSlug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

                        html += `
                            <a href="/${cleanSlug}" class="card">
                                <span class="card-badge">PRO UNLOCKED</span>
                                <h3>${displayTitle}</h3>
                                <p>Latest premium unlocked version with zero ads and high speed download link.</p>
                                <div class="card-footer">
                                    <span>Verified Safe</span>
                                    <span class="btn-download">Download ⚡</span>
                                </div>
                            </a>
                        `;
                    }
                }
                grid.innerHTML = html || '<p style="color:var(--text-muted);">No published articles yet. Create one from Admin Panel!</p>';
            } catch(e) {
                grid.innerHTML = '<p style="color:var(--text-muted);">No published articles yet.</p>';
            }
        }

        function filterApps() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = title.includes(input) ? 'flex' : 'none';
            });
        }

        fetchPosts();
    </script>
</body>
</html>
